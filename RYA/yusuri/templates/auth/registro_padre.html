{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="text-white mb-4">Creación de perfil de padre de familia</h3>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    {{ field }}
                    {% if field.errors %}
                        <small class="text-warning">{{ field.errors.0 }}</small>
                    {% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-rol w-100 mt-2">Registrar Padre de Familia</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
